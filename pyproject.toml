[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "libwsrx"
dynamic = ["version"]
description = "TCP-over-WebSocket tunnel library for Rust and Python asyncio"
requires-python = ">=3.9"
readme = "README.md"
keywords = ["asyncio", "pyo3", "rust", "tcp", "websocket"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/unDefFtr/libwsrx"
Repository = "https://github.com/unDefFtr/libwsrx"
Issues = "https://github.com/unDefFtr/libwsrx/issues"

[tool.maturin]
bindings = "pyo3"
features = ["python"]
